apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ant228920/microservices-gitops.git
    targetRevision: main
    path: charts/microservices
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true   # п. 6a: спершу false (OutOfSync), потім змінюємо на true комітом
    syncOptions:
      - CreateNamespace=true
