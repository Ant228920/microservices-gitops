config:
  rabbitmqQueue: main_queue

# Secret створюється вручну в кластері і в Git не зберігається.
# Ключі: DATABASE_URL, POSTGRES_PASSWORD, SECRET_KEY
existingSecret: app-secrets

# Argo CD виконує pre-upgrade як PreSync і під час першого встановлення
hooks:
  preUpgrade:
    enabled: false

ingress:
  enabled: false
  className: ""
  host: ""

postgres:
  image:
    repository: postgres
    tag: 15-alpine
  database: lab_db
  user: postgres
  service:
    port: 5432
  persistence:
    enabled: true
    size: 1Gi

rabbitmq:
  image:
    repository: rabbitmq
    tag: 3-management-alpine
  service:
    amqpPort: 5672
    managementPort: 15672

user:
  replicaCount: 1
  image:
    repository: ghcr.io/ant228920/microservices-user_service
    tag: sha-865266f
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

payment:
  replicaCount: 1
  image:
    repository: ghcr.io/ant228920/microservices-payment_service
    tag: sha-865266f
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

gateway:
  replicaCount: 1
  progressDeadlineSeconds: 90
  image:
    repository: ghcr.io/ant228920/microservices-gateway_service
    tag: sha-865266f
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }